spring.application.name=campusconnect
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${SERVER_PORT:8081}

# -------------------------------------------------------
# Database — values come from environment variables.
# For local dev, set these in application-local.properties
# (that file is git-ignored and never committed).
# -------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusconnect_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------
# JPA / Hibernate
# validate = Hibernate checks that the DB schema matches
# the entities — Flyway owns schema creation, not Hibernate.
# -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------
# Flyway — runs migrations from src/main/resources/db/migration
# -------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
